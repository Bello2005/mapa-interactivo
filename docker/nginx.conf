# nginx para la SPA del Chocó Biogeográfico (build estático de Vite).

server {
    listen      8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # .geojson no viene en el mime.types de nginx: sin esto se serviría como
    # application/octet-stream y quedaría fuera de gzip_types. Se reincluye el
    # mapa completo porque un bloque `types` reemplaza al heredado.
    include /etc/nginx/mime.types;
    types {
        application/geo+json  geojson;
    }
    default_type application/octet-stream;

    # Sin límite de tamaño para las capas grandes (ecosistemas.geojson ~100 MB).
    sendfile       on;
    tcp_nopush     on;
    server_tokens  off;

    add_header X-Content-Type-Options nosniff       always;
    add_header X-Frame-Options        SAMEORIGIN    always;
    add_header Referrer-Policy        same-origin   always;

    # --- Compresión ---------------------------------------------------------
    gzip             on;
    gzip_static      on;   # sirve los .gz generados en el build si existen
    gzip_vary        on;
    gzip_comp_level  5;
    gzip_min_length  1024;
    gzip_proxied     any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/geo+json
        application/manifest+json
        image/svg+xml;

    # --- Caché --------------------------------------------------------------
    # Se usa `expires` en vez de `add_header Cache-Control` a propósito: un
    # add_header dentro de un location descartaría las cabeceras de seguridad
    # heredadas del server.

    # Assets con hash en el nombre: seguros de cachear indefinidamente.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Capas geográficas: pesadas y estables, pero sin hash en el nombre.
    location /data/ {
        expires 1d;
        try_files $uri =404;
    }

    location /media/ {
        expires 30d;
        try_files $uri =404;
    }

    # Siempre fresco, para que un deploy nuevo se vea al recargar.
    location = /index.html {
        expires -1;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Cualquier otra ruta la resuelve react-router en el cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
